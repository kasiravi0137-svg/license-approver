name: Build APK

on:
  workflow_dispatch: {}
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      # Our android/ folder is hand-written and does not include the
      # Gradle wrapper (gradlew, gradlew.bat, gradle-wrapper.jar) or
      # local.properties. `flutter create` fills in only the files that
      # are missing — it will not touch build.gradle, settings.gradle,
      # AndroidManifest.xml, etc. that we already wrote.
      - name: Fill in missing Android scaffolding (gradlew, etc.)
        run: flutter create --platforms=android .

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: license-approver-apk
          path: build/app/outputs/flutter-apk/app-release.apk
